document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3093de25-473f-41d0-ae65-8a256d29f966\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Serif Display';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ac01c2ab-b818-4e18-8519-6df730316ac2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Serif Display';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b565c123-da64-401b-9055-5880df1d2b68\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Serif Display';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"aafb2d9c-eb37-4d91-a01d-7ee9967dfa81\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Serif Display';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c1943857-f010-4d28-b366-83d23b271eb0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{--bg:#ffffff;--bg-card:#f7f6f4;--bg-soft:#f1efec;--bg-page:#faf9f7;--border:rgba(0,0,0,0.07);--border-md:rgba(0,0,0,0.12);--accent:#cc7a3a;--accent-soft:rgba(204,122,58,0.10);--accent-hover:#b06428;--text-1:#16130f;--text-2:#5f5a54;--text-3:#9b938a;--danger:#b83030;--green:#3a9a5c;--r:10px;--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08),0 2px 6px rgba(0,0,0,0.04);--shadow-lg:0 12px 40px rgba(0,0,0,0.14),0 4px 14px rgba(0,0,0,0.06)}\n[data-theme=\"dark\"]{--bg:#1a1714;--bg-card:#211d18;--bg-soft:#2a251f;--bg-page:#15120f;--border:rgba(255,255,255,0.08);--border-md:rgba(255,255,255,0.14);--accent:#e08a4a;--accent-soft:rgba(224,138,74,0.14);--accent-hover:#f0985a;--text-1:#f0e9df;--text-2:#b3a99c;--text-3:#837869;--danger:#e07a7a;--green:#5cba78;--shadow-sm:0 1px 3px rgba(0,0,0,0.25);--shadow-md:0 4px 16px rgba(0,0,0,0.32),0 2px 6px rgba(0,0,0,0.22);--shadow-lg:0 12px 40px rgba(0,0,0,0.5),0 4px 14px rgba(0,0,0,0.3)}\nhtml,body{margin:0;height:100%;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg-page);color:var(--text-1);-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:var(--accent);text-decoration:none}\na:hover{color:var(--accent-hover)}\nbutton,input,textarea,select{font-family:'DM Sans',system-ui,sans-serif}\n@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}\n@keyframes drift{0%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(180deg) scale(1.08)}100%{transform:translate(-50%,-50%) rotate(360deg) scale(1)}}\n@keyframes breathe{0%,100%{opacity:.5}50%{opacity:.85}}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"height:100vh;display:flex;flex-direction:column;background:var(--bg-page);overflow:hidden\">\n\n  <sc-if value=\"{{ showAnnounce }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;align-items:center;gap:12px;padding:9px 22px;background:var(--accent-soft);border-bottom:1px solid var(--border);font-size:13px;color:var(--text-2)\">\n      <span style=\"font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)\">New<\u002Fspan>\n      <span style=\"flex:1\">ARIA now runs on your local Ollama key — set it once in Settings and it follows you across devices.<\u002Fspan>\n      <button sc-camel-on-click=\"{{ dismissAnnounce }}\" style=\"background:none;border:1px solid var(--border-md);border-radius:7px;color:var(--text-3);font-size:12px;padding:4px 10px;cursor:pointer\">Dismiss<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <header style=\"display:flex;align-items:center;gap:18px;padding:0 22px;height:56px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0\">\n    <div style=\"display:flex;align-items:center;gap:9px;flex-shrink:0\">\n      <div style=\"width:28px;height:28px;flex-shrink:0;border-radius:8px;background:var(--text-1);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:15px\">◆<\u002Fdiv>\n      <span style=\"font-family:'DM Serif Display',serif;font-size:18px;letter-spacing:-.01em;white-space:nowrap\">Cryptic Hub<\u002Fspan>\n    <\u002Fdiv>\n\n    <nav id=\"tour-nav\" style=\"display:flex;gap:2px;padding:3px;background:var(--bg-card);border:1px solid var(--border);border-radius:11px;margin-left:8px;flex-shrink:0\">\n      <sc-for list=\"{{ navItems }}\" as=\"nav\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ nav.go }}\" style=\"{{ nav.style }}\">\n          {{ nav.label }}\n          <sc-if value=\"{{ nav.badge }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ nav.count }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div style=\"flex:1\"><\u002Fdiv>\n\n    <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ true }}\">\n      <button id=\"tour-edit\" sc-camel-on-click=\"{{ toggleEdit }}\" style=\"{{ editBtnStyle }}\">\n        <span style=\"font-size:13px;line-height:1\">✎<\u002Fspan>{{ editLabel }}\n      <\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ true }}\">\n      <button id=\"tour-settings\" sc-camel-on-click=\"{{ openSettings }}\" title=\"Settings\" style=\"width:32px;height:32px;border-radius:9px;background:none;border:1px solid var(--border);color:var(--text-2);cursor:pointer;font-size:13px\" style-hover=\"border-color:var(--accent);color:var(--accent)\">⚙<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <button id=\"tour-theme\" sc-camel-on-click=\"{{ toggleTheme }}\" title=\"Theme\" style=\"width:32px;height:32px;border-radius:9px;background:none;border:1px solid var(--border);color:var(--text-2);cursor:pointer;font-size:13px\" style-hover=\"border-color:var(--accent);color:var(--accent)\">{{ themeIcon }}<\u002Fbutton>\n\n    <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--border);border-radius:20px;flex-shrink:0;white-space:nowrap\">\n        <div style=\"width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600\">{{ initial }}<\u002Fdiv>\n        <span style=\"font-size:12px;color:var(--text-2)\">{{ name }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ signOut }}\" style=\"background:none;border:none;color:var(--text-3);font-size:11px;cursor:pointer;padding:0 0 0 4px\">Sign out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ signedOut }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;gap:8px\">\n        <button sc-camel-on-click=\"{{ openSignIn }}\" style=\"padding:7px 14px;border-radius:9px;background:none;color:var(--text-2);border:1px solid var(--border-md);font-size:12.5px;font-weight:500;cursor:pointer\" style-hover=\"color:var(--text-1);border-color:var(--text-2)\">Sign in<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ openSignUp }}\" style=\"padding:7px 14px;border-radius:9px;background:var(--text-1);color:var(--bg);border:1px solid var(--text-1);font-size:12.5px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--accent);border-color:var(--accent);color:#fff\">Sign up<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isAria }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;display:flex;min-height:0\">\n      <aside id=\"tour-sidebar\" style=\"width:236px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 10px\">\n        <button sc-camel-on-click=\"{{ newChat }}\" style=\"display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);border:1px solid var(--border-md);border-radius:var(--r);font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;box-shadow:var(--shadow-sm);margin-bottom:14px\">\n          <span style=\"font-size:14px;line-height:1;color:var(--accent)\">+<\u002Fspan>New chat\n        <\u002Fbutton>\n        <div style=\"font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:0 8px 7px\">Recent<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:1px;overflow-y:auto\">\n          <sc-for list=\"{{ chats }}\" as=\"chat\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ chat.open }}\" style=\"{{ chat.style }}\">{{ chat.title }}<\u002Fbutton>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noChats }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin:0;padding:4px 10px;font-size:12px;line-height:1.55;color:var(--text-3)\">No chats yet — your first message starts one.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;padding:9px 10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3)\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2.4s infinite\"><\u002Fspan>\n          Ollama · connected\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <main style=\"flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-page)\">\n        <div id=\"aria-scroll\" style=\"flex:1;overflow-y:auto;padding:32px 0\">\n          <div style=\"max-width:680px;margin:0 auto;padding:0 28px\">\n            <sc-if value=\"{{ chatEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding-top:60px;animation:fadeUp .4s ease both\">\n                <div style=\"font-family:'DM Serif Display',serif;font-size:38px;line-height:1.15;letter-spacing:-.02em;margin-bottom:10px\">{{ greeting }}<\u002Fdiv>\n                <p style=\"font-size:15px;line-height:1.6;color:var(--text-2);margin:0 0 26px;max-width:460px;text-wrap:pretty\">Ask anything, or pull something out of the directory. ARIA remembers this conversation across your devices.<\u002Fp>\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                  <sc-for list=\"{{ suggestions }}\" as=\"s\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ s.use }}\" style=\"padding:9px 14px;background:var(--bg);border:1px solid var(--border-md);border-radius:20px;font-size:13px;color:var(--text-2);cursor:pointer;box-shadow:var(--shadow-sm)\">{{ s.text }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"0\">\n              <div style=\"{{ m.rowStyle }}\">\n                <div style=\"{{ m.bubbleStyle }}\">{{ m.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:0 28px 24px\">\n          <div id=\"tour-composer\" style=\"max-width:680px;margin:0 auto;background:var(--bg);border:1px solid var(--border-md);border-radius:14px;box-shadow:var(--shadow-md);padding:12px 14px\">\n            <textarea value=\"{{ draft }}\" sc-camel-on-change=\"{{ setDraft }}\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"Message ARIA…\" rows=\"2\" style=\"width:100%;border:none;outline:none;resize:none;background:none;color:var(--text-1);font-size:14.5px;line-height:1.55\"><\u002Ftextarea>\n            <div style=\"display:flex;align-items:center;gap:8px;padding-top:6px\">\n              <button sc-camel-on-click=\"{{ openSettings }}\" style=\"display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;background:none;border:1px solid var(--border-md);border-radius:20px;font-size:11.5px;color:var(--text-3);cursor:pointer\" style-hover=\"border-color:var(--accent);color:var(--accent)\">{{ modelLabel }}<\u002Fbutton>\n              <span style=\"font-size:11.5px;color:var(--text-3)\">Enter to send<\u002Fspan>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ send }}\" style=\"width:32px;height:32px;border-radius:9px;background:var(--text-1);color:var(--bg);border:none;cursor:pointer;font-size:14px\">↑<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isMsg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;min-height:0\">\n      <aside id=\"tour-messages\" style=\"width:296px;flex-s        <h2 style=\"font-family:'DM Serif Display',serif;font-size:29px;line-height:1.15;margin:0 0 10px\">Welcome back to Cryptic<\u002Fh2>\n        <p style=\"margin:0 0 24px;font-size:13.5px;line-height:1.6;color:var(--text-2)\">Your chats and the directory are where you left them. Last visit: 3 days ago.<\u002Fp>\n        <button sc-camel-on-click=\"{{ dismissWelcome }}\" style=\"padding:11px 22px;background:var(--text-1);color:var(--bg);border:1px solid var(--text-1);border-radius:10px;font-size:13.5px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--accent);border-color:var(--accent);color:#fff\">Pick up where I left off<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tourOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:90;pointer-events:none\">\n      <div style=\"{{ tourRingStyle }}\"><\u002Fdiv>\n      <div style=\"{{ tourCardStyle }}\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:9px\">\n          <span style=\"font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)\">{{ tourStepLabel }}<\u002Fspan>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ endTour }}\" style=\"background:none;border:none;color:var(--text-3);font-size:11.5px;cursor:pointer;padding:0\">Skip<\u002Fbutton>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'DM Serif Display',serif;font-size:19px;margin:0 0 7px\">{{ tourTitle }}<\u002Fh3>\n        <p style=\"margin:0 0 16px;font-size:13px;line-height:1.6;color:var(--text-2)\">{{ tourBody }}<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <div style=\"display:flex;gap:5px\">\n            <sc-for list=\"{{ tourDots }}\" as=\"d\" hint-placeholder-count=\"6\">\n              <span style=\"{{ d.style }}\"><\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"f ght:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)\">\n              Links or names\n              <textarea rows=\"5\" placeholder=\"One per line — a URL or just a site name\" style=\"padding:10px 12px;background:var(--bg);border:1px solid var(--border-md);border-radius:var(--r);font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text-1);outline:none;resize:vertical;line-height:1.55\"><\u002Ftextarea>\n            <\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)\">\n              <input type=\"checkbox\" checked=\"{{ true }}\">Enhance with ARIA — auto category, description &amp; icon\n            <\u002Flabel>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:20px\">\n          <button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding:9px 14px;background:var(--bg);border:1px solid var(--border-md);border-radius:9px;font-size:12.5px;color:var(--text-2);cursor:pointer\">Cancel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ confirmModal }}\" style=\"padding:9px 16px;background:var(--text-1);color:var(--bg);border:1px solid var(--text-1);border-radius:9px;font-size:12.5px;font-weight:500;cursor:pointer\">{{ modalCta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:820}}\">\nconst MODALS = {\n  signin: { title: \"Admin sign-in\", sub: \"Only the verified admin account can manage the directory.\", cta: \"Sign in\",\n    fields: [{ label: \"Email\", type: \"email\", ph: \"you@example.com\" }, { label: \"Password\", type: \"password\", ph: \"••••••••\" }] },\n  add: { title: \"Add a site\", sub: \"One link, one note on what it's for.\", cta: \"Save\",\n    fields: [{ label: \"Name\", type: \"text\", ph: \"Excalidraw\" }, { label: \"URL\", type: \"text\", ph: \"https://\" }, { label: \"Category\", type: \"text\", ph: \"Design\" }, { label: \"What it does\", type: \"text\", ph: \"One short line\" }] },\n  import: { title: \"Import bookmarks\", sub: \"Paste links or just site names, one per line. ARIA sorts and describes them; you can edit anything afterwards.\", cta: \"Add links\", fields: [] }\n};\n\nconst TOUR = [\n  { id: \"tour-nav\", view: \"aria\", place: \"below\", title: \"Three places, that's it\",\n    body: \"Home is the front door, Directory is the curated list, ARIA is the assistant. Nothing else lives in the nav.\" },\n  { id: \"tour-sidebar\", view: \"aria\", place: \"right\", title: \"Your chats, remembered\",\n    body: \"Every conversation is saved against your account, so it follows you to another device. Hover a chat to rename or delete it.\" },\n  { id: \"tour-composer\", view: \"aria\", place: \"above\", title: \"ARIA runs on your key\",\n    body: \"Messages go to your own Ollama instance — the model pill shows which one. Enter sends, Shift+Enter makes a new line.\" },\n  { id: \"tour-messages\", view: \"msg\", place: \"right\", title: \"Talk to anyone here\",\n    body: \"Search a username to start a direct chat, or pick several people for a group. Threads take text and photos, and show who's online.\" },\n  { id: \"tour-search\", view: \"dir\", place: \"below\", title: \"Find a link fast\",\n    body: \"Search matches names, categories and descriptions at once. The chips beside it narrow to one category.\" },\n  { id: \"tour-edit\", view: \"dir\", place: \"below\", title: \"Nothing changes until you say so\",\n    body: \"Edit mode is the switch for adding, importing and deleting. Off means read-only, so you can't break the list by clicking around.\" },\n  { id: \"tour-settings\", view: \"dir\", place: \"below\", title: \"Your name, your model\",\n    body: \"Settings holds what ARIA calls you and which model answers. Ollama and OpenRouter work out of the box; Claude, ChatGPT and DeepSeek run on a key you bring.\" },\n  { id: \"tour-theme\", view: \"dir\", place: \"below\", title: \"Light or dark\",\n    body: \"The whole hub follows this one toggle, and it remembers your pick.\" }\n];\n\nconst PROVIDERS = [\n  { id: \"ollama\", name: \"Ollama\", tag: \"Local · no key\", byok: false,\n    keyLabel: \"Host URL\", ph: \"http://localhost:11434\",\n    models: [\"llama3.1:8b\", \"qwen2.5:7b\", \"mistral:7b\", \"phi3:mini\"] },\n  { id: \"openrouter\", name: \"OpenRouter\", tag: \"One key, many models\", byok: false,\n    keyLabel: \"OpenRouter key\", ph: \"sk-or-…\",\n    models: [\"auto (best available)\", \"llama-3.1-70b\", \"gemini-flash-1.5\", \"mixtral-8x7b\"] },\n  { id: \"claude\", name: \"Claude\", tag: \"Your own key\", byok: true,\n    keyLabel: \"Anthropic key\", ph: \"sk-ant-…\",\n    notice: \"Cryptic doesn't resell access to Claude. Create a key in the Anthropic console and paste it here — it stays on your account and is billed to you.\",\n    models: [\"claude-sonnet-4\", \"claude-haiku-4\"] },\n  { id: \"chatgpt\", name: \"ChatGPT\", tag: \"Your own key\", byok: true,\n    keyLabel: \"OpenAI key\", ph: \"sk-…\",\n    notice: \"Cryptic doesn't resell access to OpenAI. Create a key in the OpenAI dashboard and paste it here — it stays on your account and is billed to you.\",\n    models: [\"gpt-4o\", \"gpt-4o-mini\"] },\n  { id: \"deepseek\", name: \"DeepSeek\", tag: \"Your own key\", byok: true,\n    keyLabel: \"DeepSeek key\", ph: \"sk-…\",\n    notice: \"Cryptic doesn't resell access to DeepSeek. Create a key in the DeepSeek platform and paste it here — it stays on your account and is billed to you.\",\n    models: [\"deepseek-chat\", \"deepseek-reasoner\"] }\n];\n\nconst USERS = [];\n\nlet CID = 0;\nconst AUTH = {\n  signin: { title: \"Welcome back\", sub: \"Sign in to reach your chats, messages and the directory.\", cta: \"Sign in\",\n    fields: [{ key: \"email\", label: \"Email\", type: \"email\", ph: \"you@example.com\" }, { key: \"password\", label: \"Password\", type: \"password\", ph: \"••••••••\" }] },\n  signup: { title: \"Create your account\", sub: \"Takes a minute — then a short tour of what everything does.\", cta: \"Create account & start tour\",\n    fields: [{ key: \"name\", label: \"Name\", type: \"text\", ph: \"Your name\" }, { key: \"email\", label: \"Email\", type: \"email\", ph: \"you@example.com\" }, { key: \"password\", label: \"Password\", type: \"password\", ph: \"At least 8 characters\" }] }\n};\n\nclass Component extends DCLogic {\n  state = {\n    view: \"home\", theme: \"dark\", editMode: false, signedIn: false, announce: true,\n    auth: null, welcome: false, tour: -1, rect: null, form: { name: \"\", email: \"\", password: \"\" },\n    settings: false, name: \"\", provider: \"ollama\", model: \"llama3.1:8b\",\n    handle: \"\", email: \"\", pw: { cur: \"\", next: \"\", conf: \"\" }, pwNote: \"\",\n    convos: [], activeConvo: null, msgDraft: \"\", peopleQuery: \"\", unread: {}, notif: null,\n    newChat: false, pickQuery: \"\", picked: [], groupName: \"\",\n    showKey: false, ollamaKey: \"\",\n    keys: { ollama: \"http://localhost:11434\", openrouter: \"\", claude: \"\", chatgpt: \"\", deepseek: \"\" },\n    query: \"\", cat: \"All\", sites: [], modal: null, draft: \"\", messages: [],\n    activeChat: -1, chats: []\n  };\n\n  componentDidMount() { document.documentElement.dataset.theme = this.state.theme; }\n\n  setView = (v) => () => this.setState({ view: v });\n\n  pill(active) {\n    return \"padding:6px 14px;border:none;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;\" +\n      (active ? \"background:var(--bg);color:var(--text-1);box-shadow:var(--shadow-sm)\" : \"background:none;color:var(--text-3)\");\n  }\n\n  chip(active) {\n    return \"padding:6px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:all .15s;\" +\n      (active
